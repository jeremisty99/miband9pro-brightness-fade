<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img">
<title>表盘的两层结构</title>
<desc>一张表盘由下层的静态资源层和上层的 Lua 脚本层组成；数据源驱动资源层，屏幕状态事件驱动 Lua 层。</desc>
<style>
.th{font:500 14px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#2C2C2A}
.ts{font:400 12px system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#5F5E5A}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="290" fill="#FFFFFF"/>
<rect x="40" y="40" width="390" height="230" rx="20" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="60" y="66" dominant-baseline="central">一张表盘 .face</text>
<rect x="60" y="84" width="350" height="76" rx="10" fill="#FFFFFF" stroke="#378ADD" stroke-width="1"/>
<text class="th" x="76" y="108" dominant-baseline="central" fill="#185FA5">② Lua 脚本层</text>
<text class="ts" x="76" y="132" dominant-baseline="central">会动的玻璃纸 · 定时器 / 事件 / 遮罩</text>
<rect x="60" y="176" width="350" height="76" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text class="th" x="76" y="200" dominant-baseline="central">① 资源层</text>
<text class="ts" x="76" y="224" dominant-baseline="central">印刷好的海报 · PNG + 数字控件</text>
<rect x="470" y="84" width="170" height="76" rx="10" fill="#F5F4F0" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="486" y="108" dominant-baseline="central">屏幕状态</text>
<text class="ts" x="486" y="132" dominant-baseline="central">OFF / AOD / ON</text>
<rect x="470" y="176" width="170" height="76" rx="10" fill="#F5F4F0" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="486" y="200" dominant-baseline="central">数据源</text>
<text class="ts" x="486" y="224" dominant-baseline="central">时间 / 步数 / 天气</text>
<path d="M470 122 L416 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M470 214 L416 214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
